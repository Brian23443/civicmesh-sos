name: Track 3 importer tests

on:
  pull_request:
    paths:
      - "training/import_chatbot.py"
      - "training/common.py"
      - "tests/test_importer.py"
      - ".github/workflows/importer-tests.yml"
  push:
    branches:
      - "track/t3-dashboard-data"
    paths:
      - "training/import_chatbot.py"
      - "training/common.py"
      - "tests/test_importer.py"
      - ".github/workflows/importer-tests.yml"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run importer tests
        run: python -m pytest tests/test_importer.py
