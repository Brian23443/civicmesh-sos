name: Track 3 importer tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "training/import_chatbot.py"
      - "training/common.py"
      - "tests/test_importer.py"
      - ".github/workflows/importer-tests.yml"
  push:
    branches:
      - main
    paths:
      - "training/import_chatbot.py"
      - "training/common.py"
      - "tests/test_importer.py"
      - ".github/workflows/importer-tests.yml"

permissions:
  contents: read

concurrency:
  group: importer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run importer tests
        run: python -m pytest tests/test_importer.py
