name: Track 3 dashboard

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "dashboard/**"
      - "design/REFERENCES.md"
      - ".github/workflows/dashboard.yml"
  push:
    branches:
      - main
    paths:
      - "dashboard/**"
      - "design/REFERENCES.md"
      - ".github/workflows/dashboard.yml"

permissions:
  contents: read

concurrency:
  group: dashboard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build dashboard
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Render dashboard and check browser console
        run: npm run test:smoke

      - name: Start dev server and verify port 5174
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/civicmesh-dashboard.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5174/ > /dev/null; then
              cat /tmp/civicmesh-dashboard.log
              exit 0
            fi
            sleep 1
          done
          cat /tmp/civicmesh-dashboard.log
          exit 1

      - name: Upload production dashboard
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-dist-${{ github.sha }}
          path: dashboard/dist
          if-no-files-found: error
          retention-days: 7
